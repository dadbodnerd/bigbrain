# Optional sandbox for bigbrain-node@.service (Linux, v0.2.1). Install it where it works:
#
#   mkdir -p ~/.config/systemd/user/bigbrain-node@.service.d
#   cp deploy/bigbrain-node@.service.d/sandbox.conf ~/.config/systemd/user/bigbrain-node@.service.d/
#   systemctl --user daemon-reload
#
# First check that your user manager can sandbox at all (a USER unit gets these settings only through an unprivileged user
# namespace, and systemd then turns on PrivateUsers= by itself):
#
#   systemd-run --user --wait --pipe -p PrivateTmp=yes -p ProtectSystem=strict -p ProtectHome=read-only true && echo sandbox ok
#
# If that fails, or the node then fails with status=226/NAMESPACE, do not install this file (or delete it and daemon-reload). Ubuntu
# 24.04 and later restrict unprivileged user namespaces through AppArmor by default (sysctl kernel.apparmor_restrict_unprivileged_userns).
# Two more things change inside the sandbox:
#   - PrivateUsers= maps every other user and group to nobody/nogroup: a model folder you can read only through a GROUP (say a
#     shared /data/models owned by group ml, mode 0750) is unreadable there. A world-readable folder, or one you own, is fine.
#     The GPU device files (/dev/nvidia*) are normally mode 0666 and keep working.
#   - your home is read-only except the paths below: the stage dir (~/.cache/bigbrain/), the torch extension cache (where exllamav3
#     builds its CUDA extension if no prebuilt one is installed), the CUDA JIT cache (~/.nv) and the Triton cache. A stage dir
#     elsewhere is read-only, which is fine (the node only reads it; Python skips writing __pycache__), but a stage dir under /tmp
#     is invisible: PrivateTmp gives the node its own empty /tmp.
[Service]
PrivateTmp=yes
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=-%h/.cache/bigbrain -%h/.cache/torch_extensions -%h/.nv -%h/.triton
